<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Leave — UNITOP Employee Portal</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<nav class="employee-nav">
    <span class="brand">UNITOP <small>Employee Portal</small></span>
    <div class="nav-links">
        <a href="index.html" data-page="index.html">Dashboard</a>
        <a href="payslips.html" data-page="payslips.html">My Payslips</a>
        <a href="attendance.html" data-page="attendance.html">My Attendance</a>
        <a href="leave.html" data-page="leave.html">My Leave</a>
    </div>
</nav>
<div class="container">

    <h1>My Leave</h1>
    <p class="subtitle">Your leave balances and requests.</p>

    <div id="msg" class="msg hidden"></div>

    <!-- BALANCES -->
    <div class="card">
        <h3 style="margin-top:0;">Leave Balances</h3>
        <div id="balances-grid" class="kpi-grid">
            <div class="kpi-tile"><div class="kpi-label">Loading…</div></div>
        </div>
    </div>

    <!-- FILE REQUEST -->
    <div class="card">
        <h3 style="margin-top:0;">File a Leave Request</h3>
        <form id="leave-form">
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:16px;">
                <div>
                    <label style="display:block;font-size:12.5px;color:#555;margin-bottom:4px;font-weight:600;">Leave Type</label>
                    <select id="leave_type_id" required style="width:100%;padding:9px 12px;border:1px solid #cbd5e1;border-radius:6px;font-size:13.5px;">
                        <option value="">-- Select --</option>
                    </select>
                </div>
                <div>
                    <label style="display:block;font-size:12.5px;color:#555;margin-bottom:4px;font-weight:600;">Start Date</label>
                    <input type="date" id="start_date" required style="width:100%;padding:9px 12px;border:1px solid #cbd5e1;border-radius:6px;font-size:13.5px;">
                </div>
                <div>
                    <label style="display:block;font-size:12.5px;color:#555;margin-bottom:4px;font-weight:600;">End Date</label>
                    <input type="date" id="end_date" required style="width:100%;padding:9px 12px;border:1px solid #cbd5e1;border-radius:6px;font-size:13.5px;">
                </div>
            </div>
            <button class="btn btn-primary" type="submit">File Request</button>
        </form>
    </div>

    <!-- MY REQUESTS -->
    <div class="card">
        <div class="toolbar" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
            <strong id="record-count">0 record(s)</strong>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Leave Type</th>
                    <th>Start</th>
                    <th>End</th>
                    <th class="col-center">Days</th>
                    <th class="col-center">Status</th>
                    <th class="col-center">Actions</th>
                </tr>
            </thead>
            <tbody id="rows">
                <tr class="loading-row"><td colspan="6">Loading…</td></tr>
            </tbody>
        </table>
    </div>

</div>

<script src="assets/js/axios.min.js"></script>
<script src="assets/js/sweetalert2.min.js"></script>
<script src="assets/js/dialogs.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/leave.js"></script>
</body>
</html>
