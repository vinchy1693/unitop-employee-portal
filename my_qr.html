<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>My QR Code — UNITOP</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .qr-only-wrap {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background: var(--bg, #f4f6fb);
        }
        .qr-only-card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 18px;
            padding: 28px 22px 24px;
            box-shadow: 0 18px 45px rgba(15, 23, 42, .12);
            text-align: center;
            border-top: 5px solid #0038A8;
        }
        .qr-only-card h1 {
            margin: 0 0 4px;
            font-size: 22px;
            color: #1a1f2e;
        }
        .qr-only-card .sub {
            margin: 0 0 18px;
            font-size: 12.5px;
            color: #6b7280;
        }
        #qr-holder {
            display: inline-block;
            padding: 12px;
            background: #fff;
            border: 3px solid #0038A8;
            border-radius: 12px;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-user-drag: none;
            pointer-events: none;
        }
        #qr-holder img, #qr-holder canvas { -webkit-user-drag: none; user-drag: none; }
        .qr-count {
            margin-top: 16px;
            font-size: 26px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: #0038A8;
            letter-spacing: .5px;
        }
        .qr-count.expiring { color: #b3261e; }
        .qr-purpose {
            margin-top: 2px;
            font-size: 13px;
            font-weight: 600;
            color: #1a1f2e;
        }
        .qr-warn {
            margin-top: 16px;
            padding: 10px 12px;
            border-radius: 8px;
            background: #fef3c7;
            color: #92400e;
            font-size: 12px;
            line-height: 1.45;
            text-align: left;
        }
        .qr-back {
            margin-top: 18px;
            display: inline-block;
            font-size: 12.5px;
            color: #0038A8;
            text-decoration: none;
            font-weight: 600;
        }
        .qr-state {
            padding: 26px 6px;
            color: #6b7280;
            font-size: 13.5px;
            line-height: 1.5;
        }
        @media print {
            body * { visibility: hidden !important; }
            #qr-holder, #qr-holder * { visibility: hidden !important; }
            .qr-only-card::after {
                content: "QR code is not printable. Use the on-site scanner.";
                visibility: visible !important;
                display: block;
                font-size: 18px;
                color: #000;
            }
        }
    </style>
</head>
<body>
    <main class="qr-only-wrap">
        <section class="qr-only-card" id="qr-card">
            <h1>My QR code</h1>
            <p class="sub">Show this at the on-site scanner. It expires automatically.</p>
            <div id="qr-display">
                <div class="qr-state">Loading your QR code…</div>
            </div>
            <div class="qr-warn">
                <strong>Do not share this code.</strong> It is valid for one action and expires in about two minutes.
                The page hides the QR when you leave it. A screenshot stops working after expiry.
            </div>
            <a class="qr-back" href="attendance.html">&larr; Back to Attendance</a>
        </section>
    </main>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/qrcode.min.js"></script>
    <script src="assets/js/my_qr.js"></script>
</body>
</html>
