<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem('unitop-theme');if(!t){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0038A8">
<title>My Dashboard — UNITOP Employee Portal</title>
<link rel="stylesheet" href="assets/css/style.css?v=20261031notifications">
</head>
<body>
<nav class="employee-nav">
    <span class="brand">UNITOP <small>Employee Portal</small></span>
    <div class="nav-links">
        <a href="index.html" data-page="index.html" aria-current="page">Dashboard</a>
        <a href="payslips.html" data-page="payslips.html">My Payslips</a>
        <a href="attendance.html" data-page="attendance.html">My Attendance</a>
        <a href="leave.html" data-page="leave.html">My Leave</a>
        <a href="loans.html" data-page="loans.html">My Loans</a>
        <a href="profile.html" data-page="profile.html">My Profile</a>
        <button type="button" class="theme-toggle" data-theme-toggle>🌙 Dark</button>
    </div>
</nav>

<main class="container">

    <header class="page-head">
        <div class="page-head-main">
            <p class="eyebrow">Employee self-service</p>
            <h1>Hello!</h1>
            <p class="subtitle">Your payslips, attendance and leave — all in one place.</p>
        </div>
        <div class="page-head-actions">
            <a class="btn btn-primary" href="attendance.html">Show my QR code</a>
            <a class="btn btn-plain" href="leave.html">File leave</a>
        </div>
    </header>

    <div id="kpi-grid" class="kpi-grid">
        <div class="kpi-tile"><div class="kpi-label">Loading…</div></div>
    </div>

    <div class="card notification-card" id="notification-card">
        <div class="card-head">
            <h2 class="card-title">Notifications</h2>
            <span id="notification-count" class="notification-count">0</span>
        </div>
        <div id="notification-list" class="notification-list">
            <div class="notification-empty">Loading…</div>
        </div>
    </div>

</main>

<script src="assets/js/axios.min.js"></script>
<script src="assets/js/sweetalert2.min.js"></script>
<script src="assets/js/dialogs.js"></script>
<script src="assets/js/api.js?v=20261020logoutalert"></script>
<script src="assets/js/dashboard.js?v=20261031notifications"></script>
<script src="assets/js/theme.js"></script>
</body>
</html>
